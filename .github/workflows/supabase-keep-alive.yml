# .github/workflows/supabase-keep-alive.yml
# 每天对两个 Supabase free-tier 数据库发一次 /rest/v1/ 请求。
# PostgREST 收到请求后会真实连接 PostgreSQL（读取 schema、校验 key 权限），
# 属于有效的数据库活动，可避免项目因 7 天无活动被暂停。
# Beijing 04:00 = UTC 20:00
#
# 所需 Secrets:
#   SUPABASE_SERVICE_ROLE_KEY   - 已有（project 1，deploy-trading.yml 在用）
#   SUPABASE_SERVICE_ROLE_KEY_2 - 需新增（project 2 的 service_role key）

name: Supabase Keep-Alive

on:
  schedule:
    # UTC 20:00 = 北京时间 04:00
    - cron: '0 20 * * *'
  workflow_dispatch: # 允许手动触发用于测试

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # ---------- Project 1 (qeedsnqbudbogqpcerqb) ----------
      - name: Ping Project 1
        run: |
          echo "🔔 Pinging Project 1 (qeedsnqbudbogqpcerqb)..."
          STATUS=$(curl -s -o /tmp/p1.json -w "%{http_code}" \
            "https://qeedsnqbudbogqpcerqb.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}")
          BODY=$(head -c 300 /tmp/p1.json)
          echo "HTTP $STATUS | Body: $BODY"

          if [ "$STATUS" != "200" ]; then
            echo "::error::Project 1 ping failed (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Project 1 alive"

      # ---------- Project 2 (nrzskzkigmvlegtlrmug) ----------
      - name: Ping Project 2
        run: |
          echo "🔔 Pinging Project 2 (nrzskzkigmvlegtlrmug)..."
          STATUS=$(curl -s -o /tmp/p2.json -w "%{http_code}" \
            "https://nrzskzkigmvlegtlrmug.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_2 }}")
          BODY=$(head -c 300 /tmp/p2.json)
          echo "HTTP $STATUS | Body: $BODY"

          if [ "$STATUS" != "200" ]; then
            echo "::error::Project 2 ping failed (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Project 2 alive"

      - name: Summary
        if: always()
        run: |
          echo "📅 Keep-alive run completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
